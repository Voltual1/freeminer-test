name: android

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-depth: 10

    - name: Install deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gettext ccache

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    # 比 setup-java 自带的 cache: gradle 更完善
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false          # 允许写入缓存

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: android-arm64-debug-${{ runner.os }}
        max-size: 1G
        verbose: 1

    # 缓存预编译的 native deps（最大收益点之一）
    - name: Cache Android native deps
      uses: actions/cache@v4
      with:
        path: android/deps
        key: android-deps-arm64-${{ hashFiles('android/native/build.gradle') }}
        restore-keys: |
          android-deps-arm64-

    - name: Build Debug APK (arm64 only)
      run: cd android; ./gradlew assembleDebug --build-cache

    - name: Save arm64 Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: Luanti-arm64-v8a-debug.apk
        path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
        if-no-files-found: error
